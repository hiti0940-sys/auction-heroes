  .container{max-width:640px;margin:0 auto}
  h1{text-align:center;color:#f39c12;margin-bottom:14px;font-size:22px;letter-spacing:1px}

  label{display:block;margin-bottom:6px;color:#bbb;font-size:13px}
  input[type=text],input[type=number]{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#1a1a2e;color:#eee;font-size:16px;outline:none}
  input:focus{border-color:#f39c12}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1;min-width:100px}
  .themes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .themes label{display:inline-flex;align-items:center;gap:5px;margin:0;padding:8px 12px;border-radius:20px;background:#1a1a2e;border:1px solid #333;font-size:13px;cursor:pointer}
  .themes input{accent-color:#f39c12}
  button{padding:14px 20px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:600;transition:.15s;width:100%}
  button:active:not(:disabled){transform:scale(.98)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff}
  .btn-secondary{background:#333;color:#eee}
  .btn-pass{background:#7a2020;color:#fff}
  .btn-bid{background:linear-gradient(135deg,#27ae60,#229954);color:#fff}
  .btn-row{display:flex;gap:8px;margin-top:8px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:#aaa}
  .topbar b{color:#f39c12}
  .char-card{text-align:center;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(243,156,18,.15),rgba(155,89,182,.15));border:2px solid rgba(243,156,18,.4);margin-bottom:12px}
  .char-emoji{font-size:42px;margin-bottom:4px}
  .char-img{width:100%;max-width:300px;height:340px;margin:0 auto 10px;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#0f0f1e,#1a1a2e);display:flex;align-items:center;justify-content:center}
  .char-img img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .char-img.contain img{object-fit:contain;object-position:center center}
  .char-img.face img{object-fit:cover;object-position:center 25%}
  .char-name{font-size:21px;font-weight:700;color:#f39c12;margin-bottom:3px}
  .char-source{color:#aaa;font-size:12px;margin-bottom:10px}
  .power-bar{height:12px;background:#1a1a2e;border-radius:8px;overflow:hidden;max-width:340px;margin:0 auto 5px}
  .power-fill{height:100%;background:linear-gradient(90deg,#e74c3c,#f39c12);transition:width .4s}
  .power-value{font-size:14px;color:#f39c12;font-weight:700}
  .players-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
  .player-item{background:#1a1a2e;border-radius:10px;padding:10px;border:2px solid transparent;font-size:13px}
  .player-item.active{border-color:#f39c12}
  .player-item.out{opacity:.4}
  .player-item .pn{font-weight:700;margin-bottom:3px;font-size:14px}
  .player-item .pm{color:#27ae60;font-weight:600}
  .player-item .pc{color:#888;font-size:11px;margin-top:2px}
  .bid-info{background:#1a1a2e;border-radius:12px;padding:12px;margin-bottom:12px;text-align:center}
  .bid-info .bid-amount{font-size:20px;color:#f39c12;font-weight:700}
  .bid-info .bid-who{color:#aaa;font-size:13px;margin-top:3px}
  .action-panel{text-align:center;margin-bottom:10px}
  .action-panel .turn-name{font-size:15px;margin-bottom:10px}
  .turn-name b{color:#f39c12}
  .bid-controls{display:flex;gap:8px;align-items:center}
  .bid-controls input{flex:1;min-width:0}
  .bid-controls button{flex:0 0 auto;width:auto;padding:12px 18px}
  .log{max-height:110px;overflow-y:auto;font-size:12px;color:#888;background:#141428;border-radius:8px;padding:8px;margin-top:8px}
  .log div{margin-bottom:2px}
  .results-table{width:100%;border-collapse:collapse;font-size:13px}
  .results-table th,.results-table td{padding:8px 6px;text-align:left;border-bottom:1px solid #333;vertical-align:top}
  .results-table th{color:#f39c12;font-size:12px}
  .winner{color:#f39c12;font-weight:700;font-size:17px;text-align:center;margin-bottom:12px}
  .chars-inline{color:#aaa;font-size:11px;line-height:1.4}
  .room-code{font-size:34px;font-weight:800;letter-spacing:8px;text-align:center;color:#f39c12;padding:16px;background:#141428;border-radius:14px;border:2px dashed rgba(243,156,18,.4);margin:10px 0;font-family:'Courier New',monospace}
  .lobby-players{list-style:none;margin:10px 0}
  .lobby-players li{padding:10px;background:#1a1a2e;border-radius:8px;margin-bottom:6px;font-size:14px}
  .lobby-players li::before{content:"👤 ";margin-right:4px}
  .status-msg{font-size:13px;color:#aaa;text-align:center;margin-top:8px;min-height:20px}
  .status-msg.err{color:#e74c3c}
  .status-msg.ok{color:#27ae60}
  .hidden{display:none!important}
  .mode-tabs{display:flex;gap:6px;margin-bottom:14px}
  .mode-tabs button{background:#1a1a2e;color:#aaa;border:1px solid #333;font-size:13px;padding:10px}

    </div>

    <div class="panel">

    </div>
    <button class="btn-primary" id="hsStartBtn">Начать</button>

    <div class="bid-info" id="bidInfo"></div>

  </div>
</div>

function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function genId(){return Math.random().toString(36).slice(2,10);}

function createRoom(){
  const themes = [...document.querySelectorAll('.theme:checked')].map(el=>el.value);
  if(!themes.length){alert('Выбери хотя бы одну тематику!');return;}
  const startMoney = Math.max(100, +document.getElementById('startMoney').value||1000);
  const charCount = Math.max(3, Math.min(40, +document.getElementById('charCount').value||10));
  const hostName = (document.getElementById('hostName').value.trim()||'Хост').slice(0,16);
  const pool = CHARACTERS.filter(c=>themes.includes(c.t));
  if(pool.length < charCount){alert('В тематиках только '+pool.length+' персонажей.');return;}

  state.mode='online'; state.role='host'; state.myIdx=0;
  state.startingMoney=startMoney; state.totalRounds=charCount;
  state.poolSource=themes; state.poolSize=charCount;
  state.playerId = genId();

  const code = genCode();
  state.roomCode = code;

  const room = {
    code, hostId: state.playerId, phase: 'lobby',
    totalRounds: charCount, startingMoney: startMoney,
    poolSource: themes, poolSize: charCount,
    roundNumber: 0, current: null, basePrice: 0,
    currentBid: 0, currentBidder: null, turnPointer: 0, firstBidderOffset: 0,
    activePlayers: [], log: [], pool: [],
    players: { [state.playerId]: { name: hostName, money: startMoney, characters: [], order: 0 } }
  };

  state.roomRef = db.ref('rooms/'+code);
  state.roomRef.set(room).then(()=>{
    document.getElementById('roomCode').textContent = code;
    show('lobbyScreen');
    setStatus('lobbyStatus','Комната создана. Ждём игроков...','ok');
    listenToRoom();
  }).catch(err=>{
    setStatus('lobbyStatus','Ошибка: '+err.message,'err');
  });
}

function listenToRoom(){
  if(state.roomListener && state.roomRef) state.roomRef.off('value', state.roomListener);
  state.roomListener = state.roomRef.on('value', snapshot => {
    const data = snapshot.val();
    if(!data) return;
    handleRoomUpdate(data);
  }, err => { console.error(err); });
}

function handleRoomUpdate(room){
  const players = room.players || {};
  const playerList = Object.keys(players)
    .map(k=>({id:k, ...players[k]}))
    .sort((a,b)=>(a.order||0)-(b.order||0));

  state.players = playerList;
  state.phase = room.phase;
  state.roundNumber = room.roundNumber || 0;
  state.totalRounds = room.totalRounds;
  state.startingMoney = room.startingMoney;
  state.current = room.current;
  state.basePrice = room.basePrice || 0;
  state.currentBid = room.currentBid || 0;
  state.currentBidder = room.currentBidder;
  state.turnPointer = room.turnPointer || 0;
  state.activePlayers = room.activePlayers || [];
  state.log = room.log || [];
  state.pool = room.pool || [];

  const ids = playerList.map(p=>p.id);
  state.myIdx = ids.indexOf(state.playerId);

  if(room.phase === 'lobby'){
    show('lobbyScreen');
    document.getElementById('roomCode').textContent = room.code;
    const list = document.getElementById('lobbyList');
    list.innerHTML = '';
    playerList.forEach(p=>{
      const li = document.createElement('li');
      li.textContent = p.name + (p.id === state.playerId ? ' (ты)' : '');
      list.appendChild(li);
    });
    document.getElementById('lobbyCount').textContent = '('+playerList.length+'/6)';
    const startBtn = document.getElementById('startOnlineBtn');
    if(state.role === 'host') startBtn.disabled = playerList.length < 2;
    else { startBtn.style.display = 'none'; setStatus('lobbyStatus','Ожидание начала игры хостом...'); }
  } else if(room.phase === 'playing' || room.phase === 'paused' || room.phase === 'results'){
    show('gameScreen');
    renderFromRoom(room, playerList);
  }
}

function setStatus(id,msg,cls){const el=document.getElementById(id);el.textContent=msg;el.className='status-msg'+(cls?' '+cls:'');}

function joinRoom(){
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  const name = (document.getElementById('joinName').value.trim()||'Игрок').slice(0,16);
  if(code.length < 4){setStatus('joinStatus','Введи код комнаты','err');return;}
  setStatus('joinStatus','Подключаемся...');

  state.mode='online'; state.role='client'; state.roomCode=code;
  state.playerId = genId();

  state.roomRef = db.ref('rooms/'+code);
  state.roomRef.once('value').then(snap=>{
    const room = snap.val();
    if(!room){setStatus('joinStatus','Комната не найдена','err');return;}
    if(room.phase !== 'lobby'){setStatus('joinStatus','Игра уже началась','err');return;}
    const cnt = Object.keys(room.players||{}).length;
    if(cnt >= 6){setStatus('joinStatus','Комната заполнена (6)','err');return;}
    let finalName = name; let n=2;
    while(Object.values(room.players||{}).some(p=>p.name===finalName)){finalName = name+' '+n; n++; if(n>20)break;}
    state.roomRef.child('players/'+state.playerId).set({name:finalName, money:room.startingMoney, characters:[], order: cnt});
    setStatus('joinStatus','Успешно! Ждём старта...','ok');
    listenToRoom();
  }).catch(err=>{
    setStatus('joinStatus','Ошибка: '+err.message,'err');
  });
}

document.getElementById('startOnlineBtn').onclick = startOnlineGame;

function startOnlineGame(){
  if(state.role !== 'host') return;
  const room = state.roomRef;
  room.once('value').then(snap=>{
    const data = snap.val();
    const players = data.players || {};
    if(Object.keys(players).length < 2) return;
    let pool = CHARACTERS.filter(c=>data.poolSource.includes(c.t));
    pool = shuffle(pool).slice(0, data.poolSize);
    room.child('pool').set(pool);
    room.child('phase').set('playing');
    room.child('roundNumber').set(0);
    room.child('firstBidderOffset').set(0);
    room.child('log').set([]);
    hostNextRound();
  });
}

function hostNextRound(){
  const room = state.roomRef;
  room.once('value').then(snap=>{
    const data = snap.val();
    const pool = data.pool || [];
    if(pool.length === 0){ room.child('phase').set('results'); return; }

    const players = data.players || {};
    const totalMoney = Object.values(players).reduce((s,p)=>s+(p.money||0),0);
    if(totalMoney <= 0){
      const log = (data.log||[]);
      log.push('💰 У всех закончились деньги — конец игры!');
      room.update({ phase:'results', log: log.slice(-100) });
      return;
    }

    const next = pool[0];
    const rest = pool.slice(1);
    const roundNumber = (data.roundNumber || 0) + 1;

    const playerIds = Object.keys(players).sort((a,b)=>(players[a].order||0)-(players[b].order||0));
    const activeIdx = [];
    playerIds.forEach((pid, idx) => { if(players[pid].money > 0) activeIdx.push(idx); });

    const turnPointer = activeIdx.length ? ((roundNumber - 1) % activeIdx.length) : 0;

    const updates = {
      pool: rest, current: next, basePrice: 0,
      roundNumber, currentBid: 0, currentBidder: null,
      activePlayers: activeIdx,
      turnPointer: turnPointer
    };
    const log = (data.log || []);
    log.push('— Раунд '+roundNumber+': «'+next.n+'» (сила '+next.p+')');
    updates.log = log.slice(-100);
    room.update(updates);
  });
}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderFromRoom(room, playerList){
  const view = {
    phase: room.phase,
    round: room.roundNumber || 0,
    totalRounds: room.totalRounds,
    char: room.current,
    basePrice: room.basePrice || 0,
    players: playerList.map(p=>({name:p.name, money:p.money, characters:p.characters || [], connected:true})),
    currentBid: room.currentBid || 0,
    currentBidder: room.currentBidder,
    turnIdx: (room.activePlayers && room.activePlayers.length) ? room.activePlayers[room.turnPointer] : -1,
    activeIdx: room.activePlayers || [],
    log: room.log || [],
    poolLeft: (room.pool || []).length
  };
  renderSnapshot(view);
}

    log.innerHTML = '';

    log.scrollTop = log.scrollHeight;
    lastLogCount = view.log.length;
  }
}

function calcMinBid(currentBid){
  if(!currentBid || currentBid === 0) return 1;
  return currentBid + 1;
}

function renderActionPanel(view){
  const ap = document.getElementById('actionPanel');
  if(view.phase==='paused'){ap.innerHTML='<div class="turn-name">Раунд завершён...</div>';return;}
  if(view.turnIdx===-1){ap.innerHTML='<div class="turn-name">Ждём...</div>';return;}
  const currentPlayerName = view.players[view.turnIdx].name;
  const isMyTurn = (state.myIdx === view.turnIdx);
  if(!isMyTurn){
    ap.innerHTML = '<div class="turn-name">Ход: <b>'+currentPlayerName+'</b></div>'+'<div style="color:#888;font-size:13px;margin-top:6px">Ожидание ставки...</div>';
    return;
  }
  const player = view.players[state.myIdx];
  const min = calcMinBid(view.currentBid);
  const canBid = player.money >= min;
  const defaultVal = canBid ? min : 1;
  const hint = view.currentBid === 0 ? 'Можно ставить любую сумму (от 1)' : ('Нужно больше: минимум '+min);
  ap.innerHTML = '<div class="turn-name">Твой ход · 💰 '+player.money+'</div>'+'<div style="color:#aaa;font-size:12px;margin-bottom:6px">'+hint+'</div>'+'<div class="bid-controls">'+'<input type="number" id="bidInput" min="'+min+'" max="'+player.money+'" step="1" value="'+defaultVal+'" '+(canBid?'':'disabled')+'>'+'<button class="btn-bid" id="bidBtn" '+(canBid?'':'disabled')+'>Ставка</button>'+'<button class="btn-pass" id="passBtn">Пас</button>'+'</div>'+(!canBid?'<div style="color:#e74c3c;margin-top:8px;font-size:13px">Недостаточно денег (нужно '+min+')</div>':'');
  if(canBid){
    document.getElementById('bidBtn').onclick = ()=>{ const v=+document.getElementById('bidInput').value; submitBid(v); };
  }
  document.getElementById('passBtn').onclick = submitPass;
}

function submitBid(amount){
  if(state.role === 'host') hostHandleBid(amount);
  else clientHandleBid(amount);
}
function submitPass(){
  if(state.role === 'host') hostHandlePass();
  else clientHandlePass();
}

function hostHandleBid(amount){
  const room = state.roomRef;
  room.once('value').then(snap=>{
    const data = snap.val();
    const players = data.players || {};
    const ids = Object.keys(players).sort((a,b)=>(players[a].order||0)-(players[b].order||0));
    const turnPid = ids[data.activePlayers[data.turnPointer]];
    if(turnPid !== state.playerId) return;
    const min = calcMinBid(data.currentBid);
    amount = Math.round(amount);
    if(amount < min) return;
    if(amount > players[state.playerId].money) return;
    const log = (data.log||[]);
    log.push(players[state.playerId].name+' ставит '+amount);
    const tp = (data.turnPointer+1) % data.activePlayers.length;
    const updates = { currentBid: amount, currentBidder: ids.indexOf(state.playerId), turnPointer: tp, log: log.slice(-100) };
    room.update(updates).then(()=>hostAutoCheck());
  });
}

function hostHandlePass(){
  const room = state.roomRef;
  room.once('value').then(snap=>{
    const data = snap.val();
    const players = data.players || {};
    const ids = Object.keys(players).sort((a,b)=>(players[a].order||0)-(players[b].order||0));
    const turnPid = ids[data.activePlayers[data.turnPointer]];
    if(turnPid !== state.playerId) return;
    const log = (data.log||[]);
    log.push(players[state.playerId].name+' пасует');
    const newActive = data.activePlayers.slice();
    newActive.splice(data.turnPointer, 1);
    const tp = newActive.length ? (data.turnPointer % newActive.length) : 0;
    room.update({ activePlayers: newActive, turnPointer: tp, log: log.slice(-100) }).then(()=>hostAutoCheck());
  });
}

function hostAutoCheck(){
  if(state.role !== 'host') return;
  const room = state.roomRef;
  if(!room) return;
  room.once('value').then(snap=>{
    const data = snap.val();
    if(!data || data.phase !== 'playing') return;
    if(!data.current) return;
    const ap = data.activePlayers || [];
    if(ap.length === 0){ hostFinishRound(null); return; }
    if(ap.length === 1){
      const last = ap[0];
      if(data.currentBidder === last){
        hostFinishRound(last);
      } else {
        if(data.turnPointer !== 0){
          room.child('turnPointer').set(0);
        }
      }
    }
  }).catch(e=>console.error('autoCheck:', e));
}

function hostFinishRound(winnerIdx){
  const room = state.roomRef;
  if(!room) return;
  room.once('value').then(snap=>{
    const data = snap.val();
    if(!data) return;
    if(data.phase !== 'playing') return;
    if(!data.current) return;
    const players = data.players || {};
    const ids = Object.keys(players).sort((a,b)=>(players[a].order||0)-(players[b].order||0));
    const log = (data.log||[]);
    let updates = { phase: 'paused' };
    if(winnerIdx !== null && winnerIdx !== undefined){
      const winnerPid = ids[winnerIdx];
      const newMoney = players[winnerPid].money - data.currentBid;
      const chars = (players[winnerPid].characters || []).slice();
      chars.push(data.current);
      updates['players/'+winnerPid+'/money'] = newMoney;
      updates['players/'+winnerPid+'/characters'] = chars;
      log.push('✅ '+players[winnerPid].name+' купил «'+data.current.n+'» за '+data.currentBid);
    } else {
      log.push('❌ «'+data.current.n+'» не куплен');
    }
    updates.log = log.slice(-100);
    room.update(updates).then(()=>{
      setTimeout(()=>{
        room.once('value').then(s2=>{
          const d2 = s2.val();
          if(!d2) return;
          const totalMoney = Object.values(d2.players||{}).reduce((s,p)=>s+(p.money||0),0);
          if((d2.pool||[]).length === 0 || totalMoney <= 0){
            if(totalMoney <= 0 && (d2.pool||[]).length > 0){
              const log2 = (d2.log||[]);
              log2.push('💰 У всех закончились деньги — конец игры!');
              room.update({ phase:'results', log: log2.slice(-100) });
            } else {
              room.child('phase').set('results');
            }
          }
          else { room.child('phase').set('playing'); hostNextRound(); }
        });
      }, 1800);
    });
  });
}

function renderResults(view){
  show('resultsScreen');
  const sorted = [...view.players].map((p)=>({name:p.name,money:p.money,characters:p.characters||[],totalPower:(p.characters||[]).reduce((s,x)=>s+x.p,0)})).sort((a,b)=>{if(b.totalPower!==a.totalPower)return b.totalPower-a.totalPower;return b.money-a.money;});
  const w = sorted[0];
  document.getElementById('winnerText').textContent = '🏆 '+w.name+' — сила '+w.totalPower+'!';
  const tbl = document.getElementById('resultsTable');
  tbl.innerHTML = '<tr><th>#</th><th>Игрок</th><th>Сила</th><th>Герои</th><th>💰</th></tr>';
  sorted.forEach((p,i)=>{
    const chars = (p.characters||[]).slice().sort((a,b)=>b.p-a.p).map(c=>c.n+' ('+c.p+')').join(', ')||'—';
    tbl.innerHTML += '<tr>'+'<td>'+(i+1)+'</td>'+'<td>'+p.name+'</td>'+'<td><b style="color:#f39c12">'+p.totalPower+'</b></td>'+'<td class="chars-inline">'+chars+'</td>'+'<td>'+p.money+'</td>'+'</tr>';
  });
}

/* ============ ЛОКАЛЬНЫЙ РЕЖИМ (hotseat) ============ */
const hsLocal = {players:[], pool:[], roundNumber:0, totalRounds:0, startingMoney:0, current:null, currentBid:0, currentBidder:null, activePlayers:[], turnPointer:0, basePrice:0, phase:'lobby', log:[], firstBidderOffset:0};

const hsNames = document.getElementById('hsPlayerNames');
document.getElementById('hsPlayerCount').addEventListener('input',renderHotseatNames);
function renderHotseatNames(){
  const n = Math.max(2,Math.min(6,+document.getElementById('hsPlayerCount').value||2));
  const old = [...hsNames.querySelectorAll('input')].map(i=>i.value);
  hsNames.innerHTML = '';
  for(let i=0;i<n;i++){
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.value = old[i]||('Игрок '+(i+1));
    inp.maxLength = 16;
    hsNames.appendChild(inp);
  }
}
renderHotseatNames();

document.getElementById('hsStartBtn').onclick = ()=>{
  const themes = [...document.querySelectorAll('.theme2:checked')].map(el=>el.value);
  if(!themes.length){alert('Выбери хотя бы одну тематику!');return;}
  const startMoney = Math.max(100,+document.getElementById('hsStartMoney').value||1000);
  const charCount = Math.max(3,Math.min(40,+document.getElementById('hsCharCount').value||10));
  const names = [...hsNames.querySelectorAll('input')].map(i=>i.value.trim()||'Игрок');
  let pool = CHARACTERS.filter(c=>themes.includes(c.t));
  if(pool.length<charCount){alert('В тематиках только '+pool.length+' персонажей.');return;}
  pool = shuffle(pool).slice(0,charCount);

  state.mode = 'hotseat'; state.role = 'host'; state.myIdx = -1;
  hsLocal.players = names.map(n=>({name:n,money:startMoney,characters:[]}));
  hsLocal.pool = pool;
  hsLocal.totalRounds = charCount;
  hsLocal.roundNumber = 0;
  hsLocal.startingMoney = startMoney;
  hsLocal.firstBidderOffset = 0;
  hsLocal.log = [];
  hsLocal.phase = 'playing';
  lastLogCount = 0;
  show('gameScreen');
  hsNextRound();
};

function hsNextRound(){
  if(hsLocal.pool.length === 0){ hsRenderResults(); return; }
  const totalMoney = hsLocal.players.reduce((s,p)=>s+(p.money||0),0);
  if(totalMoney <= 0){
    hsLocal.log.push('💰 У всех закончились деньги — конец игры!');
    hsRenderResults();
    return;
  }
  hsLocal.roundNumber++;
  hsLocal.current = hsLocal.pool.shift();
  hsLocal.basePrice = 0;
  hsLocal.currentBid = 0;
  hsLocal.currentBidder = null;
  hsLocal.activePlayers = hsLocal.players.map((p,i)=>p.money>0?i:-1).filter(i=>i>=0);
  if(hsLocal.activePlayers.length === 0){ hsFinishRound(null); return; }
  hsLocal.turnPointer = ((hsLocal.roundNumber - 1) % hsLocal.activePlayers.length);
  hsLocal.log.push('— Раунд '+hsLocal.roundNumber+': «'+hsLocal.current.n+'» (сила '+hsLocal.current.p+')');
  hsRender();
}

function hsRender(){
  const view = {
    phase: hsLocal.phase,
    round: hsLocal.roundNumber,
    totalRounds: hsLocal.totalRounds,
    char: hsLocal.current,
    basePrice: hsLocal.basePrice,
    players: hsLocal.players,
    currentBid: hsLocal.currentBid,
    currentBidder: hsLocal.currentBidder,
    turnIdx: hsLocal.activePlayers.length ? hsLocal.activePlayers[hsLocal.turnPointer] : -1,
    activeIdx: hsLocal.activePlayers,
    log: hsLocal.log,
    poolLeft: hsLocal.pool.length
  };
  renderSnapshot(view);
}

const origRenderActionPanel = renderActionPanel;
renderActionPanel = function(view){
  const ap = document.getElementById('actionPanel');
  if(state.mode !== 'hotseat'){ origRenderActionPanel(view); return; }
  if(view.phase==='paused'){ ap.innerHTML='<div class="turn-name">Раунд завершён...</div>'; return; }
  if(view.turnIdx === -1){ ap.innerHTML='<div class="turn-name">Ждём...</div>'; return; }
  const player = view.players[view.turnIdx];
  const min = calcMinBid(view.currentBid);
  const canBid = player.money >= min;
  const defaultVal = canBid ? min : 1;
  const hint = view.currentBid === 0 ? 'Можно ставить любую сумму (от 1)' : ('Нужно больше: минимум '+min);
  ap.innerHTML = '<div class="turn-name">Ход: <b>'+player.name+'</b> · 💰 '+player.money+'</div>'+'<div style="color:#aaa;font-size:12px;margin-bottom:6px">'+hint+'</div>'+'<div class="bid-controls">'+'<input type="number" id="bidInput" min="'+min+'" max="'+player.money+'" step="1" value="'+defaultVal+'" '+(canBid?'':'disabled')+'>'+'<button class="btn-bid" id="bidBtn" '+(canBid?'':'disabled')+'>Ставка</button>'+'<button class="btn-pass" id="passBtn">Пас</button>'+'</div>'+(!canBid?'<div style="color:#e74c3c;margin-top:8px;font-size:13px">Недостаточно денег (нужно '+min+')</div>':'');
  if(canBid){
    document.getElementById('bidBtn').onclick = ()=>{
      const v = +document.getElementById('bidInput').value;
      hsBid(hsLocal.activePlayers[hsLocal.turnPointer], v);
    };
  }
  document.getElementById('passBtn').onclick = ()=>hsPass(hsLocal.activePlayers[hsLocal.turnPointer]);
};

function hsBid(pidx, amount){
  const p = hsLocal.players[pidx];
  const min = calcMinBid(hsLocal.currentBid);
  amount = Math.round(amount);
  if(amount < min) return;
  if(amount > p.money) return;
  hsLocal.currentBid = amount;
  hsLocal.currentBidder = pidx;
  hsLocal.log.push(p.name+' ставит '+amount);
  hsLocal.turnPointer = (hsLocal.turnPointer+1) % hsLocal.activePlayers.length;
  hsCheckEnd();
}

function hsPass(pidx){
  const p = hsLocal.players[pidx];
  hsLocal.log.push(p.name+' пасует');
  hsLocal.activePlayers.splice(hsLocal.turnPointer, 1);
  if(hsLocal.turnPointer >= hsLocal.activePlayers.length) hsLocal.turnPointer = 0;
  hsCheckEnd();
}

function hsCheckEnd(){
  if(hsLocal.activePlayers.length === 0){ hsFinishRound(null); return; }
  if(hsLocal.activePlayers.length === 1){
    const last = hsLocal.activePlayers[0];
    if(hsLocal.currentBidder === last){ hsFinishRound(last); return; }
    else { hsLocal.turnPointer = 0; hsRender(); return; }
  }
  hsRender();
}

function hsFinishRound(winnerIdx){
  if(winnerIdx !== null){
    const p = hsLocal.players[winnerIdx];
    p.money -= hsLocal.currentBid;
    p.characters.push(hsLocal.current);
    hsLocal.log.push('✅ '+p.name+' купил «'+hsLocal.current.n+'» за '+hsLocal.currentBid);
  } else {
    hsLocal.log.push('❌ «'+hsLocal.current.n+'» не куплен');
  }
  hsLocal.phase = 'paused';
  hsRender();
  setTimeout(()=>{
    hsLocal.phase = 'playing';
    hsNextRound();
  }, 1800);
}

function hsRenderResults(){
  const sorted = hsLocal.players.map(p=>({name:p.name,money:p.money,characters:p.characters,totalPower:p.characters.reduce((s,x)=>s+x.p,0)})).sort((a,b)=>{if(b.totalPower!==a.totalPower)return b.totalPower-a.totalPower;return b.money-a.money;});
  const w = sorted[0];
  document.getElementById('winnerText').textContent = '🏆 '+w.name+' — сила '+w.totalPower+'!';
  const tbl = document.getElementById('resultsTable');
  tbl.innerHTML = '<tr><th>#</th><th>Игрок</th><th>Сила</th><th>Герои</th><th>💰</th></tr>';
  sorted.forEach((p,i)=>{
    const chars = p.characters.slice().sort((a,b)=>b.p-a.p).map(c=>c.n+' ('+c.p+')').join(', ')||'—';
    tbl.innerHTML += '<tr>'+'<td>'+(i+1)+'</td>'+'<td>'+p.name+'</td>'+'<td><b style="color:#f39c12">'+p.totalPower+'</b></td>'+'<td class="chars-inline">'+chars+'</td>'+'<td>'+p.money+'</td>'+'</tr>';
  });
  show('resultsScreen');
}

setInterval(function(){
  if(state.role === 'host' && state.phase === 'playing' && state.roomRef){
    hostAutoCheck();
  }
}, 800);

show('menuScreen');
</script>
